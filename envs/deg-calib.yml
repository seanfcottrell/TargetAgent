# Environment for differential expression (NEBULA via rpy2), the sheaf / topology
# stages (gudhi) and the plots.
#
#   conda env create -f envs/deg-calib.yml
#   conda run -n deg-calib Rscript -e 'install.packages("nebula", repos="https://cloud.r-project.org")'
#
# The R package `nebula` (1.5.8 here) is installed from CRAN inside the env's R;
# it is not a conda package, so the export below does not list it.
